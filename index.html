<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Pizzeria System | Item SKU Builder</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Nathan's Pizzaria</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">SKU - Generator</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="receipt_generator.html">Receipt Generator</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="card app-card">
                    <div class="card-header text-center">
                        <h3 class="mb-0">Pizzeria SKU Generator</h3>
                    </div>

                    <div class="card-body p-4">
                        <form id="sku-form">
                            <div class="mb-3">
                                <label for="food_type" class="form-label">Category</label>
                                <select id="food_type" class="form-select">
                                    <option value="Pizzas">Pizzas</option>
                                    <option value="Pastas">Pastas</option>
                                    <option value="Sides">Sides</option>
                                    <option value="Drinks">Drinks</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="item_name" class="form-label">Item Name</label>
                                <input type="text" id="item_name" class="form-control" placeholder="e.g. Pepperoni Pizza">
                            </div>

                            <div class="mb-4">
                                <label for="stock_amount" class="form-label">Current Stock</label>
                                <input type="number" id="stock_amount" class="form-control" placeholder="e.g. 40" min="0">
                            </div>

                            <div class="d-grid">
                                <input type="button" py-click="generate_pizza_sku" value="Generate Item Code"
                                       class="btn btn-generate btn-lg text-white">
                            </div>
                        </form>

                        <hr class="my-4">

                        <div id="output_sku">
                            <p class="text-muted text-center mb-0">Generated item code will display here.</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="text-center py-4 footer-custom">
        <div class="container">
            <p class="mb-0">Nathan's Pizzaria &mdash; 1st Quarter Project</p>
        </div>
    </footer>

    <py-script src="main.py"></py-script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
